version: "3"

tasks:
  install:
    desc: Install dependencies
    cmds:
      - npm install

  dev:
    desc: Start the development server
    deps: [install]
    cmds:
      - npm run dev

  build:
    desc: Build for production
    deps: [install]
    cmds:
      - npm run build

  preview:
    desc: Preview the production build
    deps: [build]
    cmds:
      - npm run preview

  import-resume:
    desc: Select a resume.json from data/archive/<company>/ via fzf and copy it to public/resume.json
    cmds:
      - |
        src=$(find data/archive -name "resume.json" | fzf --prompt="Select resume.json: ")
        if [ -z "$src" ]; then
          echo "No file selected. Aborting."
          exit 1
        fi
        cp "$src" public/resume.json
        echo "Copied $src -> public/resume.json"

  export-resume:
    desc: Copy public/giuseppe-santoro.pdf to a selected data/archive/<company>/ folder (create if needed)
    cmds:
      - |
        if [ ! -f public/giuseppe-santoro.pdf ]; then
          echo "public/giuseppe-santoro.pdf not found. Generate it first."
          exit 1
        fi
        new_opt="[+ Create new folder]"
        dest=$( (echo "$new_opt"; find data/archive -mindepth 1 -maxdepth 1 -type d) | fzf --prompt="Select destination (Ctrl-C to abort): ")
        fzf_rc=$?
        if [ $fzf_rc -ne 0 ] || [ -z "$dest" ]; then
          echo "Aborted."
          exit 1
        fi
        if [ "$dest" = "$new_opt" ]; then
          printf "Enter new folder name under data/archive/: "
          read name
          if [ -z "$name" ]; then
            echo "No name given. Aborting."
            exit 1
          fi
          dest="data/archive/$name"
          mkdir -p "$dest"
          echo "Created $dest"
        fi

        cp public/giuseppe-santoro.pdf "$dest/giuseppe-santoro.pdf"
        echo "Copied -> $dest/giuseppe-santoro.pdf"

        if [ -f public/giuseppe-santoro-bw.pdf ]; then
          cp public/giuseppe-santoro-bw.pdf "$dest/giuseppe-santoro-bw.pdf"
          echo "Copied -> $dest/giuseppe-santoro-bw.pdf"
        else
          echo "public/giuseppe-santoro-bw.pdf not found. Skipping."
        fi

        cp public/resume.json "$dest/resume.json"
        echo "Copied -> $dest/resume.json"
        
